<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Radiologie</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>Reservierung erfassen</h2>
    <form th:action="@{/reservations/new}" th:object="${reservation}" method="post" class="mt-4">
        <div class="mb-3">
            <label class="form-label">Patient</label>
            <select th:field="*{patient}" class="form-select" th:classappend="${#fields.hasErrors('patient')} ? 'is-invalid'">
                <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.vorname + ' ' + p.nachname}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('patient')}" th:errors="*{patient}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Gerät</label>
            <select th:field="*{device}" class="form-select" th:classappend="${#fields.hasErrors('device')} ? 'is-invalid'">
                <option th:each="d : ${devices}" th:value="${d.id}" th:text="${d.bezeichnung + ' (' + d.geraetetyp + ')'}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('device')}" th:errors="*{device}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Körperregion</label>
            <select th:field="*{bodyRegion}" class="form-select" th:classappend="${#fields.hasErrors('bodyRegion')} ? 'is-invalid'">
                <option th:each="br : ${bodyRegions}" th:value="${br.id}" th:text="${br.description}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('bodyRegion')}" th:errors="*{bodyRegion}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Startzeit</label>
            <input type="datetime-local" th:field="*{startTime}" class="form-control" th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Endzeit</label>
            <input type="datetime-local" th:field="*{endTime}" class="form-control" th:classappend="${#fields.hasErrors('endTime')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Kommentar</label>
            <textarea th:field="*{comment}" class="form-control" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Reservieren</button>
        <a th:href="@{/patients/list}" class="btn btn-secondary">Abbrechen</a>
    </form>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Radiologie</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>Neuen Patienten registrieren</h2>
    <form th:action="@{/patients/register}" th:object="${patient}" method="post" class="mt-4">
        <div class="mb-3">
            <label class="form-label">Sozialversicherungsnummer</label>
            <input type="number" th:field="*{svnr}" class="form-control" th:classappend="${#fields.hasErrors('svnr')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('svnr')}" th:errors="*{svnr}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Vorname</label>
            <input type="text" th:field="*{vorname}" class="form-control" th:classappend="${#fields.hasErrors('vorname')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('vorname')}" th:errors="*{vorname}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Nachname</label>
            <input type="text" th:field="*{nachname}" class="form-control" th:classappend="${#fields.hasErrors('nachname')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nachname')}" th:errors="*{nachname}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Geschlecht</label>
            <select th:field="*{gender}" class="form-select" th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid'">
                <option value="Männlich">Männlich</option>
                <option value="Weiblich">Weiblich</option>
                <option value="Divers">Divers</option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Geburtsdatum</label>
            <input type="date" th:field="*{birth}" class="form-control" th:classappend="${#fields.hasErrors('birth')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('birth')}" th:errors="*{birth}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Registrieren</button>
        <a th:href="@{/patients/list}" class="btn btn-secondary">Abbrechen</a>
    </form>
</body>
</html>

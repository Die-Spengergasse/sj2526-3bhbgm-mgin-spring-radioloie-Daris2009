<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Radiologie</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>Reservierungsliste für ein Gerät</h2>
    
    <form th:action="@{/reservations/list}" method="get" class="row g-3 mt-3 mb-5">
        <div class="col-auto">
            <select name="deviceId" class="form-select">
                <option value="">Alle Geräte anzeigen</option>
                <option th:each="d : ${devices}" th:value="${d.id}" th:text="${d.bezeichnung + ' (' + d.geraetetyp + ')'}" th:selected="${d.id == selectedDeviceId}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Anzeigen</button>
        </div>
    </form>

    <div th:if="${reservations != null}">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Patient</th>
                    <th>Gerät</th>
                    <th>Startzeit</th>
                    <th>Endzeit</th>
                    <th>Körperregion</th>
                    <th>Kommentar</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${reservations}">
                    <td th:text="${r.patient.vorname + ' ' + r.patient.nachname}"></td>
                    <td th:text="${r.device.bezeichnung + ' (' + r.device.geraetetyp + ')'}"></td>
                    <td th:text="${#temporals.format(r.startTime, 'dd.MM.yyyy HH:mm')}"></td>
                    <td th:text="${#temporals.format(r.endTime, 'dd.MM.yyyy HH:mm')}"></td>
                    <td th:text="${r.bodyRegion.description}"></td>
                    <td th:text="${r.comment}"></td>
                </tr>
                <tr th:if="${reservations.empty}">
                    <td colspan="6" class="text-center">Keine Reservierungen gefunden.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/}" class="btn btn-secondary mt-3">Zurück zum Hauptmenü</a>
</body>
</html>

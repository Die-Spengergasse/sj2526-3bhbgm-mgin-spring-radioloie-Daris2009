<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Radiologie</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>Patientenliste</h2>
    
    <table class="table table-striped mt-4">
        <thead>
            <tr>
                <th>ID</th>
                <th>SVNR</th>
                <th>Vorname</th>
                <th>Nachname</th>
                <th>Geschlecht</th>
                <th>Geburtsdatum</th>
                <th>Aktion</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${patients}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.svnr}"></td>
                <td th:text="${p.vorname}"></td>
                <td th:text="${p.nachname}"></td>
                <td th:text="${p.gender}"></td>
                <td th:text="${p.birth}"></td>
                <td>
                    <a th:href="@{/reservations/new(patientId=${p.id})}" class="btn btn-sm btn-success">Reservieren</a>
                </td>
            </tr>
            <tr th:if="${patients.empty}">
                <td colspan="7" class="text-center">Keine Patienten registriert.</td>
            </tr>
        </tbody>
    </table>

    <div class="mt-3">
        <a th:href="@{/patients/register}" class="btn btn-primary">Neuen Patienten registrieren</a>
        <a th:href="@{/}" class="btn btn-secondary">Zurück zum Hauptmenü</a>
    </div>
</body>
</html>
